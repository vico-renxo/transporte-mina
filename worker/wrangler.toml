# ════════════════════════════════════════════════════════════════
# Worker que pone la API detras de Cloudflare.
#
# VIVE EN worker/ Y NO EN LA RAIZ, y eso NO es cosmetico:
# Este archivo vive en worker/ y NO en la raiz del repo, a proposito:
# Cloudflare Pages lee el wrangler.toml de la raiz y las claves de Worker
# (main, routes) no son configuracion valida de Pages.
#
# OJO: en su momento se dijo que un wrangler.toml en la raiz habia roto
# TODOS los builds de Pages. Eso era FALSO -- el dashboard mostraba cada
# build en Success. La causa real de aquel problema fue otra: una
# variable NEXT_PUBLIC_API_URL cargada en el dashboard de Pages, que le
# gana al .env.production del repo.
#
# Tampoco existe un guardian que vigile esto. Se escribio uno y se
# retiro, porque contaba una causa equivocada (ver
# docs/REVISION_GUARDIANES.md). Mantener el archivo aca es una
# convencion, no algo verificado automaticamente.
#
# Desplegar con:  npx wrangler deploy -c worker/wrangler.toml
#
# NOMBRE NUEVO A PROPOSITO. Ya existe un Worker llamado
# "transporte-proxy" en la cuenta (el del BUG 14). Si desplegaramos con
# ese nombre le pisariamos el codigo, y si tuviera una ruta ancha
# configurada en el dashboard, este Worker pasaria a atender TODO
# viczul.com. Con un nombre distinto, desplegar no puede romper nada de
# lo que ya funciona. El viejo se borra despues, cuando este quede
# andando.
#
# NUNCA editarlo desde el dashboard (regla 4): se pierde el historial.
# ════════════════════════════════════════════════════════════════

name = "transporte-api"
main = "index.js"
compatibility_date = "2026-01-01"

# PASO 1 — desplegar aca primero.
# Da una URL propia (transporte-api.<tu-subdominio>.workers.dev) donde se
# puede probar TODO sin tocar viczul.com ni un poquito.
workers_dev = true

[vars]
ORIGEN = "https://transporte-mina.onrender.com"

# RUTA ACTIVA desde el 2026-08-30, despues de verificar el Worker en
# .workers.dev. Enruta SOLO /api/*: el resto de viczul.com lo sigue
# sirviendo Pages, y el Worker ademas deja pasar de largo cualquier cosa
# que no empiece con /api/ (red de seguridad, regla 3).
[[routes]]
pattern   = "viczul.com/api/*"
zone_name = "viczul.com"
